name: 功能建议
description: 提议新的用户能力或现有交互改进
title: "feat(app): "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 请描述当前遇到的问题，不要只给出实现方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望行为、入口和完成后的结果。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 说明目前采用过的其他方法或可以接受的折中。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 本建议不包含账号、密码、Cookie、Token、真实课表或其他个人信息。
          required: true
